<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>気づかせる君 - AI判定版</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-image {
            max-width: 100%;
            height: auto;
            width: 250px;
            border-radius: 8px;
        }
        .hello-box {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ffffff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        #startBtn {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            margin-bottom: 20px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="image/logo.jpg" alt="Logo" class="logo-image">
    </div>
    
    <button id="startBtn">開始</button>
    <div id="target" class="hello-box">待機中...</div>

    <!-- ★追加部分①：AIを動かすためのGoogle公式ライブラリを読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const targetElement = document.getElementById("target");
            const startBtn = document.getElementById("startBtn");

            let isDetecting = false;
            let lastDetectedAt = 0;
            const detectionCooldown = 2000;

            // ★あなたが作成したTeachable MachineのURL
            const URL = "https://teachablemachine.withgoogle.com/models/VKPO9VJZR/";

            // Service Workerの登録（既存のまま）
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("service-worker.js")
                    .then(registration => {
                        console.log("Service Worker registered");
                        registration.getNotifications().then(notifications => {
                            notifications.forEach(notification => notification.close());
                        });
                    });
            }

            // ★追加部分②：AIモデルを読み込む関数
            async function createModel() {
                const checkpointURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                const recognizer = speechCommands.create(
                    "BROWSER_FFT", 
                    undefined, 
                    checkpointURL, 
                    metadataURL
                );
                await recognizer.ensureModelLoaded();
                return recognizer;
            }

            startBtn.addEventListener("click", async function() {
                try {
                    // 通知の許可をリクエスト（既存のまま）
                    const permission = await Notification.requestPermission();
                    if (permission !== "granted") {
                        alert("通知が許可されていません。");
                        return;
                    }

                    targetElement.textContent = "AIを準備中...";
                    startBtn.style.display = "none";

                    // ★追加部分③：AIモデルを起動
                    const recognizer = await createModel();
                    const classLabels = recognizer.wordLabels(); // 学習したクラス名（背景音、冷蔵庫の音など）を取得

                    targetElement.textContent = "音を監視中...";

                    // ★追加部分④：AIが音を常に聞き取り、判定する処理
                    recognizer.listen(result => {
                        if (isDetecting) return; // すでに検知処理中なら無視（連続で鳴るのを防ぐ）

                        const scores = result.scores; // 各クラスの確率（0.0〜1.0）が入っている配列

                        // 最も確率の高い音（スコア）を探す
                        let maxScore = 0;
                        let maxScoreIndex = 0;
                        for (let i = 0; i < classLabels.length; i++) {
                            if (scores[i] > maxScore) {
                                maxScore = scores[i];
                                maxScoreIndex = i;
                            }
                        }

                        // 判定ロジック：
                        // 1. 確率が80%以上 (maxScore > 0.80) であること
                        // 2. その音が0番目（通常は「背景音」）ではないこと
                        if (maxScore > 0.80 && maxScoreIndex !== 0) {
                            
                            const now = Date.now();
                            if (now - lastDetectedAt >= detectionCooldown) {
                                lastDetectedAt = now;
                                isDetecting = true;
                                
                                // 検知したクラス名（Teachable Machineで入力した名前）を画面に表示
                                const detectedName = classLabels[maxScoreIndex];
                                targetElement.textContent = `${detectedName} を検知！`;
                                
                                // プッシュ通知と振動の実行
                                navigator.serviceWorker.ready.then(reg => {
                                    reg.getNotifications().then(notifications => {
                                        notifications.forEach(notification => notification.close());
                                    });
                                    reg.showNotification("気づかせる君", {
                                        body: `${detectedName} が鳴っています！冷蔵庫を確認してください。`,
                                        icon: "image/logo.jpg",
                                        tag: "sound-detected",
                                        renotify: false,
                                        vibrate: [500, 200, 500, 200, 500]
                                    });
                                });
                                
                                // 画面を開いているスマホ本体も振動させる
                                if (navigator.vibrate) {
                                    navigator.vibrate([500, 200, 500, 200, 500]);
                                }
                                
                                // 3秒後に「音を監視中...」の待機画面に戻す
                                setTimeout(() => {
                                    targetElement.textContent = "音を監視中...";
                                    isDetecting = false;
                                }, 3000);
                            }
                        }
                    }, {
                        includeSpectrogram: true, // AIの判定に必要
                        probabilityThreshold: 0.80, // 80%以上の自信がある時だけ反応
                        invokeCallbackOnNoiseAndUnknown: true,
                        overlapFactor: 0.50 
                    });

                } catch (error) {
                    console.error(error);
                    alert("マイクへのアクセスが拒否されたか、エラーが発生しました。");
                    startBtn.style.display = "block";
                    targetElement.textContent = "エラーが発生しました";
                }
            });
        });
    </script>
</body>
</html>
