<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-image {
            max-width: 100%;
            height: auto;
            width: 250px;
            border-radius: 8px;
        }

        .hello-box {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ffffff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        #startBtn {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            margin-bottom: 20px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="image/logo.jpg" alt="気づかせる君 ロゴ" class="logo-image">
    </div>

    <button id="startBtn">マイクをオンにする</button>

    <div id="target" class="hello-box"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const targetElement = document.getElementById("target");
            const startBtn = document.getElementById("startBtn");
            targetElement.textContent = "気づかせる君！";

            let isDetecting = false;
            let lastDetectedAt = 0;
            const detectionCooldown = 5000;

            /* ★新規追加：Service Worker を登録 */
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("service-worker.js")
                    .then(() => console.log("Service Worker registered"));
            }

            startBtn.addEventListener("click", async function() {
                try {

                    /* ★新規追加：通知の許可を求める */
                    const permission = await Notification.requestPermission();
                    if (permission !== "granted") {
                        alert("通知が許可されていません");
                        return;
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const analyser = audioContext.createAnalyser();
                    const microphone = audioContext.createMediaStreamSource(stream);

                    microphone.connect(analyser);
                    analyser.fftSize = 2048; // FFTサイズを大きくして精度を上げる
                    const dataArray = new Uint8Array(analyser.frequencyBinCount);

                    targetElement.textContent = "音を監視中...";
                    startBtn.style.display = "none";

                    function checkAudio() {
                        if (isDetecting) return;

                        analyser.getByteFrequencyData(dataArray);

                        let maxVolume = 0;
                        let peakIndex = 0; // 追加: 最大音量の位置を記録
                        for (let i = 0; i < dataArray.length; i++) {
                            if (dataArray[i] > maxVolume) {
                                maxVolume = dataArray[i];
                                peakIndex = i; // 追加
                            }
                        }
                        
                        const now = Date.now();
                        if (maxVolume > 50 && peakIndex > 120 && now - lastDetectedAt >= detectionCooldown) {
                            lastDetectedAt = now;
                            isDetecting = true;
                            targetElement.textContent = "音がした";

                            setTimeout(() => {

                                /* ★新規追加：通知バーに通知を送る */
                                navigator.serviceWorker.ready.then(reg => {
                                    reg.showNotification("気づかせる君", {
                                        body: "冷蔵庫を閉めてください！",
                                        icon: "image/logo.jpg"
                                    });
                                });

                                alert("音を検知しました！");

                                targetElement.textContent = "音を監視中...";
                                isDetecting = false;
                                requestAnimationFrame(checkAudio);
                            }, 100);

                        } else {
                            requestAnimationFrame(checkAudio);
                        }
                    }

                    checkAudio();

                } catch (error) {
                    alert("マイクの使用が許可されていません。ブラウザの設定を確認してください。");
                }
            });
        });
    </script>
</body>
</html>
